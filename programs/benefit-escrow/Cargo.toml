[package]
name = "benefit-escrow"
version = "0.1.0"
description = "G5_ESCROW_AND_DUAL_TERMINAL Benefit Escrow Program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "benefit_escrow"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", features = ["token", "associated_token"] }
solana-program = "=2.1.0"
blake3 = "=1.5.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(target_os, values("solana"))',
    'cfg(feature, values("anchor-debug", "custom-heap", "custom-panic"))',
] }
