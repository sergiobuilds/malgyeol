<!doctype html>
<html lang="ko" data-type-scale="0" data-contrast="normal" data-easy="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>말결 — 먹거리 지원 주문</title>
<meta name="description" content="말로 먹거리를 묻고, 남은 지원금과 총액을 확인한 뒤 판매처에 주문하는 먹거리 지원 서비스 말결.">
<!-- caseId가 붙은 주소가 외부로 새지 않도록 referrer를 같은 출처로 제한한다 -->
<meta name="referrer" content="same-origin">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <!-- data-surface가 세 표면의 골격을 가른다.
       ben  : 이용자 모바일 (390px 기준, 상단바 + 하단 4탭)
       ops  : 기관 담당자 PC (1440px 기준, 좌측 업무함 레일)
       demo : 심사 데모 (1440px 기준, 한 줄 사건 서사) -->
  <div class="app" id="app" data-surface="ben">

    <header class="bhead" id="bhead">
      <button type="button" class="iconbtn" id="btn-back" aria-label="이전 화면으로" hidden>
        <svg class="ico" aria-hidden="true"><use href="#i-chevron-left"></use></svg>
      </button>
      <a class="wordmark" href="?v=hub" aria-label="말결 데모 입구로">
        <span class="wordmark__mark" aria-hidden="true"></span>
        <span class="wordmark__text">말결</span>
      </a>
      <button type="button" class="iconbtn" id="btn-a11y" aria-label="글자 크기와 화면 설정" aria-expanded="false">
        <svg class="ico" aria-hidden="true"><use href="#i-tune"></use></svg>
      </button>
    </header>

    <nav class="opsrail" id="opsrail" aria-label="업무함" hidden>
      <div class="opsrail__inner">
        <p class="opsrail__title">업무함</p>
        <div class="railnav" id="ops-nav"></div>
        <div class="opsrail__foot" id="ops-scope"></div>
      </div>
    </nav>

    <main id="main" class="view" tabindex="-1"></main>

    <nav class="bnav" id="bnav" aria-label="주요 메뉴">
      <a class="bnav__item" href="?v=home" data-nav="home">
        <svg class="ico" aria-hidden="true"><use href="#i-home"></use></svg><span>홈</span>
      </a>
      <a class="bnav__item" href="?v=search" data-nav="search">
        <svg class="ico" aria-hidden="true"><use href="#i-search"></use></svg><span>상품 찾기</span>
      </a>
      <a class="bnav__item" href="?v=orders" data-nav="orders">
        <svg class="ico" aria-hidden="true"><use href="#i-list"></use></svg><span>주문 내역</span>
      </a>
      <a class="bnav__item" href="?v=help" data-nav="help">
        <svg class="ico" aria-hidden="true"><use href="#i-circle-question"></use></svg><span>도움</span>
      </a>
    </nav>
  </div>

  <!-- 화면 설정 시트 -->
  <div class="sheet-root" id="a11y-sheet" hidden>
    <div class="dimmer" data-close="a11y"></div>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="a11y-title">
      <div class="sheet__grab" aria-hidden="true"></div>
      <div class="sheet__head">
        <h2 id="a11y-title" class="t-heading2 w-bold">글자와 화면 설정</h2>
        <button type="button" class="iconbtn" data-close="a11y" aria-label="설정 닫기">
          <svg class="ico" aria-hidden="true"><use href="#i-close"></use></svg>
        </button>
      </div>
      <div class="sheet__body" id="a11y-body"></div>
    </div>
  </div>

  <div class="sr-only" role="status" aria-live="polite" id="live-status"></div>
  <div class="sr-only" role="status" aria-live="assertive" id="live-alert"></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
</body>
</html>
