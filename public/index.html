<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="전화 한 통으로 승인된 돌봄서비스를 요청하고 실제 수령까지 확인하는 말결 시연">
  <title>말결 · 전화로 이어지는 통합돌봄</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="/?v=home" aria-label="말결 홈">
        <span class="brand__mark" aria-hidden="true">말</span>
        <span><strong>말결</strong><small>전화로 이어지는 통합돌봄</small></span>
      </a>
      <nav class="nav" aria-label="주요 화면">
        <a href="/?v=home" data-nav="home">어르신 화면</a>
        <a href="/?v=provider" data-nav="provider">수행기관</a>
        <a href="/?v=ops" data-nav="ops">담당자</a>
        <a href="/?v=demo" data-nav="demo">발표 모드</a>
      </nav>
      <div class="route-state"><i aria-hidden="true"></i><span>합성 시연</span></div>
    </header>

    <main id="main" tabindex="-1">
      <div id="view" aria-live="polite"></div>
    </main>

    <footer class="footer">
      <p><strong>말결</strong>은 신규 자격을 판정하지 않습니다. 승인된 개인별지원계획 안에서 요청과 제공 결과를 잇습니다.</p>
      <p>현재 화면과 데이터는 합성 시연이며 실제 서울시·자치구 시스템과 연결되어 있지 않습니다.</p>
    </footer>
  </div>
  <script src="/app.js" defer></script>
</body>
</html>
